schema: spec-driven

context: |
  Proyecto: "Micropicores", app de estudio para el grupo de la clase del curso
  "Entrenamiento de Micropicores" (El Código del Comportamiento, sinergología).
  Fuente única de contenido: ../CC_ENTRENAMIENTO DE MICROPICORES.pdf (27 páginas,
  133 puntos etiquetados en 24 láminas). No se añade contenido que no esté en el PDF.
  La app muestra el aviso de prudencia de la página 2 al entrar y da crédito al curso.

  Idiomas: código en inglés (identificadores, archivos, campos JSON, claves, URLs);
  español para conversación, documentación, OpenSpec, commits, contenido del PDF y
  textos de interfaz (siempre en es.json vía react-i18next). Prompts de imágenes en inglés.
  Glosario en CONTEXT.md; decisiones transversales en docs/adr/; proceso en docs/workflow.md.

  Stack: React + Vite + TypeScript strict, CSS Modules, React Router, react-i18next,
  Vitest + React Testing Library, ESLint + Prettier con husky/lint-staged. npm, Node 24.
  Estructura por features: src/app, src/features/<feature>/{domain,ui,index.ts}, src/shared.
  domain/ es TypeScript puro (sin React, DOM, fetch, localStorage); lo exterior entra inyectado.
  Datos en public/data/regions.json y points.json con la forma de la futura API FastAPI
  (repositorio aparte). Coordenadas en porcentaje. Progreso en localStorage con userId nulo.
  Sin librería de estado (hooks propios). ErrorBoundary + reportError; Sentry después.
  Despliegue: GitHub + Netlify (main a producción, previsualización por PR); GitHub Actions
  (tsc, lint, tests) requerido para fusionar; merge commit; release-please para versiones.
  Móvil primero.

  Git: ramas feat/<nombre> o fix/<nombre>, una por cambio; un commit por tarea con mensaje
  tipo(scope): descripción; los commits y PRs los ejecuta el usuario, Claude entrega el mensaje.
  TDD estricto solo en los seams de docs/adr/0004-test-seams.md.

  Imágenes: figura neutra de línea fina en tono piel con luz difusa, sin relleno pleno
  (sin sexo marcado, sin ropa, sin pelo, fondo blanco), generada por el usuario en la web de
  Gemini Nano Banana con imagen de referencia. Lenguaje visual y tokens: docs/design/tokens.md. Claude escribe los prompts y NUNCA dibuja
  figuras ni rostros en SVG o código. Las flechas y marcadores SVG sobre la imagen sí.

  Lateralidad (convención del PDF): lado izquierdo del sujeto = personal / yo / deseo;
  lado derecho del sujeto = exterior / el otro / interés. La figura se muestra de frente
  (como la ve un observador) con un rótulo fijo de lateralidad.

  Identificadores: id UUID v4 fijo generado una vez + clave legible para humanos.

rules:
  proposal:
    - Incluir siempre una sección "Fuera de alcance"
  tasks:
    - Tareas de máximo 2 horas cada una
    - Las tareas que requieren imágenes generadas por el usuario van marcadas "(requiere imagen)"
